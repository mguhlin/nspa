name: Publish NSPA website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lab/package-lock.json
            audit/web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: audit/go/go.sum
      - name: Install lab dependencies
        run: npm ci --prefix lab
      - name: Validate mission content and run engine tests
        working-directory: lab
        run: |
          npm run validate
          npm test
      - name: Install browser for interaction and accessibility checks
        working-directory: lab
        run: npx playwright install --with-deps chromium
      - name: Test lab and introduction webdeck
        working-directory: lab
        run: npm run test:browser
      - name: Build lab and verify production asset paths
        working-directory: lab
        run: npm run build
      - name: Install, test, and build Security Audit Toolkit (web)
        working-directory: audit/web
        run: |
          npm ci
          npm test
          npm run build
          npm run test:browser
      - name: Sync embedded UI and test Security Audit Toolkit (Go)
        run: |
          ./audit/go/scripts/sync-assets.sh
          cd audit/go && go test -v ./... && go build -trimpath -o /tmp/ssat-ci ./cmd/ssat && /tmp/ssat-ci --version
      - name: Check local links and migration destinations
        run: |
          python3 scripts/check_site.py
      - name: Stage public files
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
  # Deploy after the upload job finishes to avoid the Pages artifact-lookup race.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
