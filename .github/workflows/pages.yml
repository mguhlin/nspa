name: Publish NSPA website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install lab dependencies
        run: npm ci --prefix lab
      - name: Validate mission content and run engine tests
        working-directory: lab
        run: |
          npm run validate
          npm test
      - name: Install browser for interaction and accessibility checks
        working-directory: lab
        run: npx playwright install --with-deps chromium
      - name: Test lab and introduction webdeck
        working-directory: lab
        run: npm run test:browser
      - name: Build lab and verify production asset paths
        working-directory: lab
        run: npm run build
      - name: Check local links and migration destinations
        run: |
          python3 scripts/check_site.py
      - name: Stage public files
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
