name: Build & Release SSAT Standalone Go Binaries
on:
  push:
    tags:
      - 'ssat-v1.0.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: audit/go/go.sum
      - name: Build and test shared web UI
        working-directory: audit/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Sync embedded assets and test Go module
        run: |
          ./audit/go/scripts/sync-assets.sh
          cd audit/go && go test -v ./...
      - name: Cross-compile portable Go binaries and checksums
        run: |
          mkdir -p dist-release
          cd audit/go
          for target in "windows amd64 .exe" "darwin arm64 " "darwin amd64 " "linux amd64 " "linux arm64 "; do
            set -- $target
            GOOS="$1" GOARCH="$2" EXT="${3:-}"
            OUT="ssat-${GOOS}-${GOARCH}${EXT}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -o "../../dist-release/${OUT}" ./cmd/ssat
          done
          cd ../../dist-release
          sha256sum ssat-* > SHA256SUMS.txt
          ls -lh
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/ssat-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist-release/* --title "SSAT Standalone Go Edition ${TAG}" --notes "Portable local-only Go binaries embedding the exact shared SSAT web UI and 30-control catalog. Verify SHA256SUMS.txt before running."
