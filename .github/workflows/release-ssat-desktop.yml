name: Build SSAT offline desktop apps
on:
  push:
    tags: ['ssat-v1.1.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            name: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
          - os: macos-15
            platform: darwin/arm64
            name: macos-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            name: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache-dependency-path: audit/go/desktop/go.sum
      - name: Install Linux build and display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb xauth dbus-x11
      - name: Build shared UI and test file compatibility
        shell: bash
        run: |
          npm ci --prefix audit/web
          npm test --prefix audit/web
          npm run build --prefix audit/web
          bash audit/go/scripts/sync-assets.sh
          cd audit/go
          go test ./...
      - name: Build desktop application
        shell: bash
        working-directory: audit/go/desktop
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
            export CGO_CFLAGS='-mmacosx-version-min=13.0'
            export CGO_LDFLAGS='-mmacosx-version-min=13.0'
          fi
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          if [ "$RUNNER_OS" = Linux ]; then
            go test -tags webkit2_41 ./...
            wails build -clean -skipbindings -tags webkit2_41 -platform '${{ matrix.platform }}'
          else
            go test ./...
            wails build -clean -skipbindings -platform '${{ matrix.platform }}'
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            go version -m build/bin/SSAT.app/Contents/MacOS/SSAT > build-info.txt
          elif [ "$RUNNER_OS" = Windows ]; then
            go version -m build/bin/SSAT.exe > build-info.txt
          else
            go version -m build/bin/SSAT > build-info.txt
          fi
          go list -m all > modules.txt
          python ../scripts/collect-notices.py
      - name: Test native Linux application without networking
        if: runner.os == 'Linux'
        working-directory: audit/go/desktop
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          mkdir -p /tmp/ssat-smoke
          sudo --preserve-env=WEBKIT_DISABLE_DMABUF_RENDERER unshare -n timeout 60s xvfb-run -a dbus-run-session -- "$PWD/build/bin/SSAT" --smoke-test /tmp/ssat-smoke
          sudo cat /tmp/ssat-smoke/native-smoke.json
          sudo python3 -c 'import json; assert json.load(open("/tmp/ssat-smoke/native-smoke.json"))["passed"]'
      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package/SSAT release
          cp audit/go/desktop/build/bin/SSAT audit/go/desktop/build-info.txt audit/go/desktop/modules.txt audit/go/desktop/THIRD-PARTY-LICENSES.txt package/SSAT/
          cp audit/go/desktop/START-HERE.txt audit/go/desktop/THIRD-PARTY-NOTICES.md package/SSAT/
          tar -czf release/ssat-desktop-${{ matrix.name }}.tar.gz -C package SSAT
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package release
          cp -R audit/go/desktop/build/bin/SSAT.app package/
          plutil -lint package/SSAT.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' package/SSAT.app/Contents/Info.plist)" = '13.0'
          ssat_arch='${{ matrix.platform }}'
          ssat_arch="${ssat_arch#*/}"
          if [ "$ssat_arch" = amd64 ]; then ssat_arch=x86_64; fi
          lipo package/SSAT.app/Contents/MacOS/SSAT -verify_arch "$ssat_arch"
          cp audit/go/desktop/START-HERE.txt audit/go/desktop/THIRD-PARTY-NOTICES.md audit/go/desktop/build-info.txt audit/go/desktop/modules.txt audit/go/desktop/THIRD-PARTY-LICENSES.txt package/
          ditto -c -k --sequesterRsrc --keepParent package release/ssat-desktop-${{ matrix.name }}.zip
          unzip -q release/ssat-desktop-${{ matrix.name }}.zip -d extracted
          test -x extracted/package/SSAT.app/Contents/MacOS/SSAT
      - name: Package Windows app with full offline runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/SSAT, release | Out-Null
          Copy-Item audit/go/desktop/build/bin/SSAT.exe package/SSAT/
          Copy-Item audit/go/desktop/START-HERE.txt, audit/go/desktop/THIRD-PARTY-NOTICES.md, audit/go/desktop/build-info.txt, audit/go/desktop/modules.txt, audit/go/desktop/THIRD-PARTY-LICENSES.txt package/SSAT/
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile package/SSAT/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          $signature = Get-AuthenticodeSignature package/SSAT/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Microsoft runtime publisher verification failed' }
          $signature | Format-List Status, SignerCertificate | Out-File package/SSAT/runtime-publisher.txt
          Compress-Archive -Path package/SSAT -DestinationPath release/ssat-desktop-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssat-${{ matrix.name }}
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ssat-*
          merge-multiple: true
          path: release
      - name: Publish verified packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum ssat-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title 'SSAT 1.1 — simpler roadmap and offline desktop' --notes-file audit/go/desktop/RELEASE-NOTES.md
